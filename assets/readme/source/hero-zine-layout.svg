  <title id="title">DamNUS — Damn! NUS! Good.</title>
  <desc id="desc">Editable typography overlay for the generated Minimal Zine Poster background.</desc>

  <g id="project-title" fill="#26241f">
    <text x="112" y="155" font-family="American Typewriter, Courier New, monospace"
          font-size="25" font-weight="600" letter-spacing="4.5">OPENCLI / NUS CAMPUS SYSTEMS</text>
